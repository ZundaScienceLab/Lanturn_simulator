<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#040e1a">
<title>ランターン滅亡シミュレーター | 深海5,000mの光は世界を滅ぼすか</title>
<style>
:root{
  color-scheme: dark;
  --abyss:#040e1a; --deep:#0a2336; --panel:#0d2c42; --line:#1d4763;
  --bio:#4be3ff; --bio-dim:#2a96b5; --amber:#ffb454; --doom:#ff5252; --foam:#e8f4f8;
  --mono:"SFMono-Regular","Consolas","Menlo",monospace;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{forced-color-adjust:none;-webkit-text-size-adjust:100%}
input,button{color-scheme:dark}
html,body{background:#040e1a !important;color:#e8f4f8;font-family:var(--sans);min-height:100%}
body{background:radial-gradient(ellipse 120% 60% at 50% -10%, #0e3450 0%, transparent 60%),var(--abyss)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{padding:26px 0 18px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:.35em;color:var(--bio);font-weight:700}
h1{font-size:clamp(22px,4.5vw,34px);font-weight:800;line-height:1.3;margin-top:8px}
h1 em{font-style:normal;color:var(--bio);text-shadow:0 0 18px rgba(75,227,255,.55)}
.lede{margin-top:10px;font-size:13px;color:#c3d9e4;line-height:1.8}
.lede b{color:var(--foam)}
.grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:20px}
@media(min-width:880px){.grid{grid-template-columns:400px 1fr}}
.sea-card{background:var(--deep);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.sea-card canvas{display:block;width:100%;height:auto}
.sea-label{position:absolute;top:10px;left:12px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#cfe6f2;
  text-shadow:-1px -1px 0 #04101e,1px -1px 0 #04101e,-1px 1px 0 #04101e,1px 1px 0 #04101e}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel h2{font-size:11px;letter-spacing:.3em;color:#a8cbdd;font-weight:700;padding-bottom:10px;border-bottom:1px dashed var(--line);margin-bottom:14px}
.ctrl{margin-bottom:16px}
.ctrl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.ctrl-head label{font-size:13px;font-weight:700}
.ctrl-head .val{font-family:var(--mono);font-size:13px;color:var(--bio)}
.analogy{
  margin-top:6px;font-size:12px;font-weight:700;color:#ffcf8a;
  background:rgba(255,180,84,.13);border:1px solid rgba(255,180,84,.45);
  border-radius:6px;padding:6px 10px;line-height:1.5;
}
input[type=range]{width:100%;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--bio-dim),var(--bio));outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:20px;height:20px;border-radius:50%;background:var(--foam);border:3px solid var(--bio);cursor:pointer;box-shadow:0 0 12px rgba(75,227,255,.6)}
input[type=range]:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
#wave{background:linear-gradient(90deg,#7b5cff,#4be3ff,#41e07c,#ffe14b,#ff8d3a,#ff5252)}
.white-toggle{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:8px;color:#dcebf3}
.white-toggle input{width:16px;height:16px;accent-color:var(--bio)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.presets button{background:transparent;border:1px solid #2d617f;color:#dcebf3;font-family:var(--sans);font-size:12px;padding:7px 12px;border-radius:6px;cursor:pointer;transition:.2s}
.presets button:hover{border-color:var(--bio);color:var(--bio)}
.presets button.on{background:rgba(75,227,255,.12);border-color:var(--bio);color:var(--bio)}
.decide{
  width:100%;margin-top:6px;padding:14px;border-radius:8px;border:none;cursor:pointer;
  font-family:var(--sans);font-size:15px;font-weight:800;letter-spacing:.2em;
  background:linear-gradient(135deg,#ff5252,#ff8d3a);color:#fff;
  box-shadow:0 0 24px rgba(255,82,82,.4);transition:.2s;
}
.decide:hover{transform:translateY(-1px);box-shadow:0 0 34px rgba(255,82,82,.6)}
.results{margin-top:18px;display:grid;gap:14px}
.power-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;text-align:center}
.power-card .cap{font-size:11px;letter-spacing:.3em;color:#a8cbdd}
.power-num{font-family:var(--mono);font-size:clamp(26px,6vw,44px);font-weight:700;color:var(--bio);text-shadow:0 0 22px rgba(75,227,255,.45);margin:8px 0 2px;word-break:break-all}
.power-num sup{font-size:.55em}
.power-sub{font-family:var(--mono);font-size:12px;color:#bdd6e2}
.power-jp{font-size:13px;font-weight:700;color:var(--amber);margin-top:6px}
.doom{border-radius:10px;padding:18px 20px;border:1px solid;transition:background .4s,border-color .4s}
.doom .lv{font-family:var(--mono);font-size:11px;letter-spacing:.25em;margin-bottom:6px}
.doom .verdict{font-size:clamp(16px,3.6vw,21px);font-weight:800;line-height:1.5;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.doom .detail{font-size:13px;line-height:1.9;margin-top:10px;color:rgba(255,255,255,.85)}
.gauge{height:10px;border-radius:5px;background:#08141f;margin-top:14px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.gauge i{display:block;height:100%;border-radius:5px;transition:width .4s,background .4s}
.compare{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.compare h2{font-size:11px;letter-spacing:.3em;color:#a8cbdd;margin-bottom:12px}
.cmp-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.cmp-row:last-child{border-bottom:none}
.cmp-row .name{color:#d8e9f2}
.cmp-row .x{font-family:var(--mono);color:var(--amber);text-align:right;white-space:nowrap}
.cmp-row .x.over{color:var(--doom);font-weight:700}
footer{margin-top:34px;font-size:12px;color:#93b3c4;line-height:1.9;border-top:1px solid var(--line);padding-top:14px}

/* ---- 神視点モード ---- */
#god{
  position:fixed;inset:0;background:#000;z-index:100;display:none;
  align-items:center;justify-content:center;flex-direction:column;
}
#god.show{display:flex}
#godCv{max-width:100%;max-height:78vh;display:block}
#godUI{
  position:absolute;left:0;right:0;bottom:0;padding:18px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));
}
#godVerdict{
  font-size:clamp(16px,4vw,26px);font-weight:800;text-align:center;line-height:1.6;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,
    -2px 0 0 #000,2px 0 0 #000,0 -2px 0 #000,0 2px 0 #000,0 0 18px rgba(0,0,0,.95);
  opacity:0;transition:opacity 1s;max-width:760px;
}
#godStats{font-family:var(--mono);font-size:12px;color:#ffd9a8;text-align:center;opacity:0;transition:opacity 1s;
  text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 10px #000}
#godBack{
  background:transparent;border:1px solid #888;color:#ddd;font-family:var(--sans);
  font-size:13px;padding:10px 26px;border-radius:6px;cursor:pointer;letter-spacing:.15em;
  opacity:0;transition:opacity .5s,border-color .2s;
}
#godBack:hover{border-color:#fff;color:#fff}
#mute{
  position:absolute;top:14px;right:14px;z-index:5;
  background:rgba(0,0,0,.5);border:1px solid #777;color:#fff;
  font-size:18px;width:44px;height:44px;border-radius:50%;cursor:pointer;
}
#mute:hover{border-color:#fff}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">LANTURN DOOMSDAY SIMULATOR</div>
  <h1>深海<em id="hDepth">5,000m</em>から届く光は、<br>世界をどこまで滅ぼすか。</h1>
  <p class="lede">ポケモン図鑑いわく、ランターンの光は<b>水深5,000mの深さからでも水面に届く</b>。
  水面でどれくらいの明るさに見えるか・何色か・発光効率はいくつか——初期条件を決めて「シミュレーションする」を押すと、
  必要な発光パワーを物理計算(拡散光の逆二乗則 × ランベルト・ベールの法則)し、宇宙からの視点で地球の結末を再現します。</p>
</header>

<div class="grid">
  <div class="sea-card">
    <span class="sea-label">OCEAN CROSS-SECTION</span>
    <canvas id="sea" width="400" height="560"></canvas>
  </div>

  <div>
    <div class="panel">
      <h2>INITIAL CONDITIONS — 初期条件</h2>

      <div class="presets" id="presets">
        <button data-p="dex" class="on">動画と同じ条件</button>
        <button data-p="modest">優しい世界</button>
        <button data-p="day">昼でもピカピカ</button>
        <button data-p="max">ランターンの本気</button>
        <button data-p="mood">🎲 ランターンの気分</button>
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><label for="lux">水面で観測される明るさ</label><span class="val" id="luxV"></span></div>
        <input type="range" id="lux" min="-9" max="5" step="0.1" value="-9">
        <div class="analogy" id="luxA"></div>
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><label for="depth">発光する深さ</label><span class="val" id="depthV"></span></div>
        <input type="range" id="depth" min="100" max="10920" step="20" value="5000">
        <div class="analogy" id="depthA"></div>
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><label for="wave">光の色(波長)</label><span class="val" id="waveV"></span></div>
        <input type="range" id="wave" min="400" max="700" step="5" value="470">
        <label class="white-toggle"><input type="checkbox" id="white" checked>
          白色光モード(アニメ準拠) — 青成分で計算して3倍する</label>
        <div class="analogy" id="waveA"></div>
      </div>

      <div class="ctrl" style="margin-bottom:10px">
        <div class="ctrl-head"><label for="eff">発光効率</label><span class="val" id="effV"></span></div>
        <input type="range" id="eff" min="1" max="683" step="1" value="100">
        <div class="analogy" id="effA"></div>
      </div>

      <button class="decide" id="decide">▶ シミュレーションする</button>
    </div>

    <div class="results">
      <div class="power-card">
        <div class="cap">REQUIRED OUTPUT — 必要な発光パワー</div>
        <div class="power-num" id="power"></div>
        <div class="power-jp" id="powerJp"></div>
        <div class="power-sub" id="powerSub"></div>
      </div>
